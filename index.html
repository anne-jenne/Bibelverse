<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dein Bibelvers</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f8f1e7, #eee3d2);
        color: #4b3b2a;
        text-align: center;
    }

    .container {
        background: rgba(255,255,255,0.9);
        padding: 35px 25px;
        border-radius: 25px;
        max-width: 500px;
        width: 85%;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    /* Kleine Bibel */
    .bible {
        width: 90px;
        height: 65px;
        margin: 0 auto 25px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .book {
        position: absolute;
        width: 42px;
        height: 58px;
        background: #8b5e3c;
        border-radius: 5px 2px 2px 5px;
        box-shadow: inset -5px 0 rgba(0,0,0,0.12);
    }

    .book.left {
        transform: rotate(-7deg);
        left: 4px;
    }

    .book.right {
        transform: rotate(7deg);
        right: 4px;
    }

    /* Kreuz */
    .cross {
        position: relative;
        z-index: 2;
        width: 10px;
        height: 38px;
        background: #f7ead8;
        border-radius: 2px;
    }

    .cross::before {
        content: "";
        position: absolute;
        width: 30px;
        height: 10px;
        background: #f7ead8;
        left: -10px;
        top: 10px;
        border-radius: 2px;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 25px;
    }

    #verse {
        font-size: 21px;
        line-height: 1.6;
        margin-bottom: 15px;
    }

    #reference {
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 25px;
    }

    button {
        border: none;
        background: #8b5e3c;
        color: white;
        padding: 13px 24px;
        border-radius: 30px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #70492f;
    }
</style>
</head>

<body>

<div class="container">

    <div class="bible">
        <div class="book left"></div>
        <div class="book right"></div>
        <div class="cross"></div>
    </div>

    <h1>Dein Bibelvers für heute</h1>

    <div id="verse"></div>
    <div id="reference"></div>

    <button onclick="newVerse()">Neuen Vers anzeigen</button>

</div>

<script>

const verses = [
    {
        text: "Der HERR ist mein Hirte, mir wird nichts mangeln.",
        reference: "Psalm 23,1"
    },
    {
        text: "Ich vermag alles durch den, der mich mächtig macht.",
        reference: "Philipper 4,13"
    },
    {
        text: "Fürchte dich nicht, denn ich bin mit dir.",
        reference: "Jesaja 41,10"
    },
    {
        text: "Alle eure Sorge werft auf ihn; denn er sorgt für euch.",
        reference: "1. Petrus 5,7"
    },
    {
        text: "Der HERR segne dich und behüte dich.",
        reference: "4. Mose 6,24"
    },
    {
        text: "Seid stark und mutig! Fürchtet euch nicht.",
        reference: "5. Mose 31,6"
    },
    {
        text: "Gott ist unsere Zuversicht und Stärke.",
        reference: "Psalm 46,2"
    },
    {
        text: "Freut euch allezeit im Herrn!",
        reference: "Philipper 4,4"
    },
    {
        text: "Denn bei Gott ist kein Ding unmöglich.",
        reference: "Lukas 1,37"
    },
    {
        text: "Der HERR ist nahe allen, die ihn anrufen.",
        reference: "Psalm 145,18"
    },
    {
        text: "Ich bin bei euch alle Tage bis an der Welt Ende.",
        reference: "Matthäus 28,20"
    },
    {
        text: "Meine Gnade genügt dir, denn meine Kraft ist in den Schwachen mächtig.",
        reference: "2. Korinther 12,9"
    }
];

function newVerse() {
    const random = Math.floor(Math.random() * verses.length);
    document.getElementById("verse").textContent = "„" + verses[random].text + "“";
    document.getElementById("reference").textContent = verses[random].reference;
}

newVerse();

</script>

</body>
</html>
