<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dein Bibelvers</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f2ea;
      font-family: Georgia, serif;
      color: #4a4038;
      text-align: center;
    }

    .box {
      max-width: 700px;
      margin: 20px;
      padding: 40px 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .vers {
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .stelle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    button {
      background: #8b7355;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-family: Georgia, serif;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="vers" id="vers">
      Dein Bibelvers wird geladen ...
    </div>

    <div class="stelle" id="stelle"></div>

    <button onclick="neuenVersWaehlen()">
      ✨ Neuen Bibelvers wählen
    </button>

  </div>

  <script>

    const verse = [

      {
        text: "Der Herr ist mein Hirte, mir wird nichts mangeln.",
        stelle: "Psalm 23,1"
      },

      {
        text: "Fürchte dich nicht, denn ich bin mit dir; sei nicht ängstlich, denn ich bin dein Gott.",
        stelle: "Jesaja 41,10"
      },

      {
        text: "Alle eure Sorge werft auf ihn; denn er sorgt für euch.",
        stelle: "1. Petrus 5,7"
      },

      {
        text: "Ich vermag alles durch den, der mich mächtig macht.",
        stelle: "Philipper 4,13"
      },

      {
        text: "Der Herr segne dich und behüte dich.",
        stelle: "4. Mose 6,24"
      },

      {
        text: "Seid stark und mutig! Fürchtet euch nicht und habt keine Angst.",
        stelle: "5. Mose 31,6"
      },

      {
        text: "Denn bei Gott ist kein Ding unmöglich.",
        stelle: "Lukas 1,37"
      },

      {
        text: "Der Herr ist nahe allen, die ihn anrufen.",
        stelle: "Psalm 145,18"
      },

      {
        text: "Freut euch allezeit im Herrn! Wiederum sage ich: Freut euch!",
        stelle: "Philipper 4,4"
      },

      {
        text: "Dies ist der Tag, den der Herr gemacht hat; lasst uns freuen und fröhlich an ihm sein.",
        stelle: "Psalm 118,24"
      },

      {
        text: "Ich bin bei euch alle Tage bis an der Welt Ende.",
        stelle: "Matthäus 28,20"
      },

      {
        text: "Der Herr ist meine Stärke und mein Schild.",
        stelle: "Psalm 28,7"
      },

      {
        text: "Befiehl dem Herrn deine Wege und hoffe auf ihn; er wird's wohlmachen.",
        stelle: "Psalm 37,5"
      },

      {
        text: "Vertraue auf den Herrn von ganzem Herzen.",
        stelle: "Sprüche 3,5"
      },

      {
        text: "Er hat seinen Engeln befohlen, dass sie dich behüten auf allen deinen Wegen.",
        stelle: "Psalm 91,11"
      },

      {
        text: "Der Herr ist mein Licht und mein Heil; vor wem sollte ich mich fürchten?",
        stelle: "Psalm 27,1"
      },

      {
        text: "Meine Hilfe kommt vom Herrn, der Himmel und Erde gemacht hat.",
        stelle: "Psalm 121,2"
      },

      {
        text: "Seid fröhlich in Hoffnung, geduldig in Trübsal, beharrlich im Gebet.",
        stelle: "Römer 12,12"
      },

      {
        text: "Gott ist unsere Zuversicht und Stärke, eine Hilfe in den großen Nöten.",
        stelle: "Psalm 46,2"
      },

      {
        text: "Der Herr wird für euch streiten, und ihr werdet stille sein.",
        stelle: "2. Mose 14,14"
      },

      {
        text: "Ich lasse dich nicht fallen und verlasse dich nicht.",
        stelle: "Josua 1,5"
      },

      {
        text: "Sei getrost und unverzagt; fürchte dich nicht und lass dich nicht erschrecken.",
        stelle: "1. Chronik 28,20"
      },

      {
        text: "Der Herr ist gut, seine Güte währt ewig.",
        stelle: "Psalm 100,5"
      },

      {
        text: "Schmecket und sehet, wie freundlich der Herr ist.",
        stelle: "Psalm 34,9"
      },

      {
        text: "Wir wissen aber, dass denen, die Gott lieben, alle Dinge zum Besten dienen.",
        stelle: "Römer 8,28"
      },

      {
        text: "Denn ich weiß wohl, was ich für Gedanken über euch habe, spricht der Herr: Gedanken des Friedens und nicht des Leidens.",
        stelle: "Jeremia 29,11"
      },

      {
        text: "Der Herr ist denen nahe, die zerbrochenen Herzens sind.",
        stelle: "Psalm 34,19"
      },

      {
        text: "Seid allezeit fröhlich.",
        stelle: "1. Thessalonicher 5,16"
      },

      {
        text: "Betet ohne Unterlass.",
        stelle: "1. Thessalonicher 5,17"
      },

      {
        text: "Seid dankbar in allen Dingen; denn das ist der Wille Gottes.",
        stelle: "1. Thessalonicher 5,18"
      }

    ];


    function neuenVersWaehlen() {

      const letzterVers = localStorage.getItem("letzterVers");

      let neuerVers;

      do {
        neuerVers = Math.floor(Math.random() * verse.length);
      } while (
        verse.length > 1 &&
        neuerVers == letzterVers
      );

      localStorage.setItem("letzterVers", neuerVers);

      document.getElementById("vers").textContent =
        "„" + verse[neuerVers].text + "“";

      document.getElementById("stelle").textContent =
        verse[neuerVers].stelle;
    }


    // Beim Öffnen automatisch einen Vers anzeigen
    neuenVersWaehlen();

  </script>

</body>
</html>
