<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dein Bibelvers</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5efe5;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #4a3b32;
    }

    .box {
      max-width: 600px;
      margin: 20px;
      padding: 35px 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 25px;
    }

    #vers {
      font-size: 23px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    #stelle {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 13px 22px;
      border-radius: 10px;
      background: #8c6f5a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #705744;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>✨ Dein Bibelvers für heute ✨</h1>

    <div id="vers"></div>
    <div id="stelle"></div>

    <button onclick="neuerVers()">Neuen Vers anzeigen</button>
  </div>

    function neuerVers() {
      const zufall = Math.floor(Math.random() * verse.length);

      document.getElementById("vers").textContent = "„" + verse[zufall][0] + "“";
      document.getElementById("stelle").textContent = verse[zufall][1];
    }

    neuerVers();

  </script>

</body>
</html>
