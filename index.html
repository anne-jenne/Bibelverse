<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dein Bibelvers</title>
</head>
<body>
  <h1>Dein Bibelvers für heute</h1>

  <p id="vers"></p>

  <button onclick="neuerVers()">Neuen Bibelvers anzeigen</button>

  <script>
    const verse = [
      "Der Herr ist mein Hirte; mir wird nichts mangeln. – Psalm 23,1",
      "Ich vermag alles durch den, der mich mächtig macht. – Philipper 4,13",
      "Fürchte dich nicht, denn ich bin mit dir. – Jesaja 41,10",
      "Alle eure Sorge werft auf ihn; denn er sorgt für euch. – 1. Petrus 5,7",
      "Denn bei Gott ist kein Ding unmöglich. – Lukas 1,37",
      "Der Herr segne dich und behüte dich. – 4. Mose 6,24",
      "Seid fröhlich in Hoffnung, geduldig in Trübsal, beharrlich im Gebet. – Römer 12,12"
    ];

    function neuerVers() {
      const zufall = Math.floor(Math.random() * verse.length);
      document.getElementById("vers").textContent = verse[zufall];
    }

    neuerVers();
  </script>
</body>
</html>
